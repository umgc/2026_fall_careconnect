  <!-- Improved web rendering -->
  <style>
    body {
      background-color: #FFFFFF;
      height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
    }
    
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      width: 100%;
      background-color: #FFFFFF;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 999;
    }
    
    .loading img {
      width: 120px;
      height: 120px;
      animation: pulse 1.5s infinite ease-in-out;
    }
    
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }

    /* Hardware acceleration for smoother animations */
    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* Better touch handling for mobile web */
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    
    /* Ensure Material Icons render correctly */
    .material-icons {
      font-family: 'Material Icons';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
    }
    
    /* Ensure icons are loaded before Flutter app starts */
    .icon-preload {
      font-family: 'Material Icons';
      position: absolute;
      left: -9999px;
      visibility: hidden;
    }
  </style>

  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #ffffff;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">

  </picture>
  
  
  
  
  
  
  <!-- Preload Material Icons to prevent X symbols -->
  <span class="icon-preload">visibility</span>

  <span class="icon-preload">settings</span>
  <span class="icon-preload">smart_toy</span>

  <!-- Loading indicator that shows until Flutter loads -->
  <div class="loading" id="loading">
    <img src="icons/Icon-192.png" alt="Loading CareConnect">
  </div>
  
  <script>
    // Add platform detection classes to the body element
    function detectPlatform() {
      var userAgent = navigator.userAgent || navigator.vendor || window.opera;
      var body = document.body;
      
      // Detect iOS
      if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        body.classList.add('ios-device');
      } 
      // Detect Android
      else if (/android/i.test(userAgent)) {
        body.classList.add('android-device');
      }
      // Detect desktop browsers
      else if (window.innerWidth >= 1024) {
        body.classList.add('desktop-browser');
      }
      // Detect mobile browsers
      else {
        body.classList.add('mobile-browser');
      }
      
      // Detect touch capability
      if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        body.classList.add('touch-device');
      } else {
        body.classList.add('no-touch-device');
      }
    }
    
    // Run platform detection as soon as possible
    detectPlatform();
    
    // Hide loading indicator once Flutter is initialized
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.display = 'none';
      }
    });
  </script>
  
  <script src="flutter_bootstrap.js" async=""></script>
