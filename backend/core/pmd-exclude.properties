# PMD violations that do not fail the build (maven-pmd-plugin excludeFromFailureFile).
# Format: fully.qualified.ClassName=Rule[,Rule]. Each entry needs a reason.

# Spring Data derived queries: the underscore in findByCheckIn_Id is Spring Data's
# property-path separator, not a naming mistake.
com.careconnect.repository.AnswerRepository=MethodNamingConventions
com.careconnect.repository.CheckInQuestionRepository=MethodNamingConventions

# These methods document null as a distinct result ("no match", "no type filter",
# "not stored", "days not set"). An empty value would change behavior; for example,
# an empty type set in toTypeSet would mean "match nothing" instead of "no filter".
com.careconnect.service.ai.ask.AiAskService=ReturnEmptyCollectionRatherThanNull
com.careconnect.service.ai.ask.AskAiDocumentOcrService=ReturnEmptyCollectionRatherThanNull
com.careconnect.service.visibility.CaregiverVisibilityService=ReturnEmptyCollectionRatherThanNull
com.careconnect.util.TaskMapper=ReturnEmptyCollectionRatherThanNull
