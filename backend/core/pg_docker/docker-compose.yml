#version: '3.5'

services:
  postgres:
    container_name: postgres_container
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-careconnect}
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
      - ./init-scripts:/docker-entrypoint-initdb.d
      - ../src/main/resources/db/migration:/migration-files:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - postgres
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-careconnect}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin

    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - postgres
    restart: unless-stopped

  dam-sidecar:
    container_name: dam_sidecar_container
    # Named so `up` reuses an existing local build instead of rebuilding (~10 min, ~1.7 GB of
    # model downloads). Rebuild after sidecar changes with: docker compose build dam-sidecar
    image: careconnect-dam-sidecar:local
    build: ../../condition-detection-sidecar
    environment:
      MIN_SPEECH_SECONDS: ${MIN_SPEECH_SECONDS:-30}
      MAX_SPEECH_SECONDS: ${MAX_SPEECH_SECONDS:-600}
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-1}
    # The backend runs on the host and calls http://localhost:8000; no shared network needed.
    ports:
      - "8000:8000"
    mem_limit: 4g
    restart: unless-stopped

networks:
  postgres:
    driver: bridge

volumes:
  postgres:
  pgadmin: