# Test Configuration - Optimized for fast test execution
# Load local .env when present (same as dev profile)
spring.config.import=optional:file:.env[.properties]
# Application name
spring.application.name=careconnect-backend
# Use local JDBC credentials (not AWS SSM) during tests
careconnect.database.use-aws-config=false
# Database configuration for tests - PostgreSQL (matches dev Docker setup)
careconnect.db.url=${JDBC_URI:jdbc:postgresql://localhost:5432/careconnect}
careconnect.db.username=${DB_USER:postgres}
careconnect.db.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${JDBC_URI:jdbc:postgresql://localhost:5432/careconnect}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
# Fix autocommit issue for tests
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
# JPA configuration for tests - Let JPA create tables for tests
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
# Transaction management for tests
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
# Disable Flyway for tests - use JPA table creation instead
spring.flyway.enabled=false
# Fast logging for tests
logging.level.root=ERROR
logging.level.com.careconnect=WARN
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
# Disable banner
spring.main.banner-mode=off
# Email configuration for tests
careconnect.email.provider=console
careconnect.email.from=rashnafibab@sample.com
# JWT configuration for tests
security.jwt.secret=${SECURITY_JWT_SECRET:test-secret-key-for-testing-only}
jwt.expiration.ms=10800000
# Frontend URL for tests
frontend.base-url=http://localhost:3000
# Disable management endpoints for tests
management.endpoints.enabled-by-default=false
# Disable Ask AI indexing poller during tests (invoke RetrievalIndexService directly in unit tests)
careconnect.indexing.worker.enabled=false
careconnect.embedding.enabled=false
careconnect.ai.citation.backfill.enabled=false
