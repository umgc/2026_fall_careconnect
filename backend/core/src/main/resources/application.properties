# =============================================================================
# Invite-token system (issue #53)
# =============================================================================

# Base URL used to build shareable invite links / QR targets (issue #69).
careconnect.invite.base-url=${CARECONNECT_INVITE_BASE_URL:https://app.careconnect.io/invite}

# Default token TTL when the request omits ttlHours.
careconnect.invite.default-ttl-hours=${CARECONNECT_INVITE_DEFAULT_TTL_HOURS:72}

# Hard cap on requested TTL (7 days).
careconnect.invite.max-ttl-hours=${CARECONNECT_INVITE_MAX_TTL_HOURS:168}

# How often (ms) the scheduled expiry sweep runs. Default 15 minutes.
careconnect.invite.sweep-interval-ms=${CARECONNECT_INVITE_SWEEP_INTERVAL_MS:900000}
