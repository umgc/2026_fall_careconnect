spring.application.name=careconnect

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true

# --- Run V30__Virtual_Check_in.sql + V31__Virtual_Check_In_Questions.sql at startup ---
spring.sql.init.mode=always
spring.sql.init.platform=postgres
spring.sql.init.schema-locations=\
  classpath:db/migration/V30__Virtual_Check_in.sql,\
  classpath:db/migration/V32__add_alexa_columns_to_patient.sql,\
  classpath:db/migration/V33__add_ma_number_to_patient.sql
spring.sql.init.data-locations=classpath:db/migration/V31__Virtual_Check_In_Questions.sql


# Database Configuration - We replaced the spring.datasource.* one's to avoid conflicts
careconnect.db.url=${JDBC_URI:jdbc:postgresql://localhost:5432/careconnect}
careconnect.db.username=${DB_USER:postgres}
careconnect.db.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable startup info logging
spring.main.banner-mode=off
spring.output.ansi.enabled=never

# Comprehensive Logging Configuration
logging.level.root=INFO
logging.level.com.careconnect=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.boot=INFO
logging.level.org.hibernate=WARN
logging.level.org.apache=WARN
logging.level.com.zaxxer.hikari=INFO
logging.level.org.flywaydb=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


# Performance optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Additional Safe Performance Optimizations
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128

# Database Connection Pool Optimizations
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# Subscription plan identifiers (used by SubscriptionEnrichmentService for plan-type matching)
subscription.premium-price-ids=${SUBSCRIPTION_PREMIUM_IDS:premium}
subscription.standard-price-ids=${SUBSCRIPTION_STANDARD_IDS:standard}
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.auto-commit=false

# JVM and Spring Boot Performance
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.types.json.use_jdbc_json=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server port (defaults to 8080)
server.port=${SERVER_PORT:8080}

# Email Configuration - Environment-based setup
# For DEVELOPMENT: Use Mailtrap (catches emails for testing)
# For PRODUCTION: Use SendGrid or Gmail (sends real emails)

# Development (Mailtrap) - Set EMAIL_PROVIDER=mailtrap
spring.mail.host=${MAIL_HOST:live.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:api}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Email provider selection
# Options: console, mailtrap, smtp, resend, mailgun, sendgrid, gmail
# - console: Log emails to console (basic development)
# - mailtrap: Use Mailtrap for email testing (recommended for development)
# - smtp: Generic SMTP server
# - resend: Resend API (production)
# - mailgun: Mailgun API (production)
# - sendgrid: SendGrid (production)
# - gmail: Gmail SMTP (production)
careconnect.email.provider=${EMAIL_PROVIDER:sendgrid}

# From email address - Must be a valid domain for Mailtrap/SMTP
# For Mailtrap: Use any valid email format (doesn't need to be real)
# For production: Use your actual domain
careconnect.email.from=${FROM_EMAIL:smpestest@gmail.com}

# API-based email provider configurations
# These are used when EMAIL_PROVIDER is set to the respective service

# Resend API configuration
careconnect.email.resend.api-key=${RESEND_API_KEY:}

# SendGrid API configuration
careconnect.email.sendgrid.api-key=${SENDGRID_API_KEY:}

# Mailgun API configuration
careconnect.email.mailgun.api-key=${MAILGUN_API_KEY:}
careconnect.email.mailgun.domain=${MAILGUN_DOMAIN:}

# Frontend base URL for email links
frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}

# Upload directory configuration - Use environment variable for security
careconnect.upload.dir=${UPLOAD_DIR:${user.home}/Documents/uploads}
careconnect.baseurl=${BASE_URL:http://localhost:8080}
careconnect.cors_allowed=${CORS_ALLOWED_LIST:http://localhost:*,http://127.0.0.1:*,https://main.dpsx8p4n4v314.amplifyapp.com}

security.jwt.secret=${SECURITY_JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION:10800000}

openai.api-key=${OPENAI_API_KEY}
# Apple/Google native billing config
apple.shared-secret=${APPLE_SHARED_SECRET:}
google.access-token=${GOOGLE_ACCESS_TOKEN:}
google.service-account-file=${GOOGLE_SERVICE_ACCOUNT_FILE:}

# DeepSeek AI Configuration
deepseek.api.key=${DEEPSEEK_API_KEY:}
openrouter.api.key=${DEEPSEEK_OPENROUTER_API_KEY:}
deepseek.api.url=${DEEPSEEK_API_URL:https://api.deepseek.com/v1}
openrouter.api.url=https://openrouter.ai/api/v1
careconnect.deepseek.enabled=${DEEPSEEK_ENABLED:false}
careconnect.ai.provider=${AI_PROVIDER:bedrock}
careconnect.ai.model=${AI_MODEL:anthropic.claude-sonnet-4-5-20250929-v1:0}
careconnect.bedrock.enabled=true
careconnect.ai.provider=${AI_MODEL_PROVIDER:bedrock}

# Chat Memory Configuration
careconnect.chat.memory.use-database-persistence=true
careconnect.chat.memory.default-max-messages=20
careconnect.chat.memory.premium-max-messages=50
careconnect.chat.memory.auto-cleanup=true
careconnect.chat.memory.cleanup-after-days=30
careconnect.chat.memory.compress-old-messages=false
careconnect.chat.memory.enable-summarization=true
careconnect.chat.memory.summarization-threshold=100


spring.security.oauth2.client.registration.fitbit.client-id=${FITBIT_CLIENT_ID}
spring.security.oauth2.client.registration.fitbit.client-secret=${FITBIT_CLIENT_SECRET}
spring.security.oauth2.client.registration.fitbit.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.fitbit.redirect-uri={baseUrl}/login/oauth2/code/fitbit
spring.security.oauth2.client.registration.fitbit.scope=activity,heartrate,sleep,weight,profile

spring.security.oauth2.client.provider.fitbit.authorization-uri=${FITBIT_AUTHORIZATION_URI:https://www.fitbit.com/oauth2/authorize}
spring.security.oauth2.client.provider.fitbit.token-uri=${FITBIT_TOKEN_URI:https://api.fitbit.com/oauth2/token}
spring.security.oauth2.client.provider.fitbit.user-info-uri=${FITBIT_USERINFO_URI:https://api.fitbit.com/1/user/-/profile.json}
spring.security.oauth2.client.provider.fitbit.user-name-attribute=user_id



spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}

spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_SCOPE:openid,email,profile}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/google}
spring.security.oauth2.client.registration.google.client-name=${GOOGLE_CLIENT_NAME:Google}

spring.security.oauth2.client.provider.google.authorization-uri=${GOOGLE_AUTH_URI:https://accounts.google.com/o/oauth2/v2/auth}
spring.security.oauth2.client.provider.google.token-uri=${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
spring.security.oauth2.client.provider.google.user-info-uri=${GOOGLE_USERINFO_URI:https://www.googleapis.com/oauth2/v3/userinfo}

spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code

email.crypto.secret=${EMAIL_CRYPTO_SECRET:careconnect-dev-secret-32-bytes!!}

# OpenAPI Documentation Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.filter=true
# Disable default OpenAPI security for documentation endpoints
springdoc.swagger-ui.disable-swagger-default-url=true

# Firebase Configuration for Push Notifications
firebase.project-id=${FIREBASE_PROJECT_ID:careconnectcapstone}
firebase.service-account-key=${FIREBASE_SERVICE_ACCOUNT_KEY:firebase-service-account.json}
firebase.sender-id=${FIREBASE_SENDER_ID:663999888931}

# Flyway is disabled for all deployed environments (dev, staging, prod).
# Production schema: SchemaPatchRunner + Hibernate ddl-auto (see application-prod.properties).
# db/migration/*.sql remains the canonical schema reference for developers; optional local
# use via ./mvnw flyway:migrate — never wired into ECS or GitHub Actions deploy pipelines.
spring.flyway.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

aws.s3.access-key=${AWS_ACCESS_KEY_ID}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.s3.bucket=${AWS_S3_BUCKET_NAME:${AWS_S3_BUCKET:}}
aws.s3.region=${AWS_DEFAULT_REGION:us-east-1}
aws.s3.base-url=${AWS_S3_BASE_URL:}

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# WebSocket Configuration (defaults to disabled, enable per profile)
careconnect.websocket.enabled=${WEBSOCKET_ENABLED:false}
careconnect.websocket.mode=${WEBSOCKET_MODE:aws}

# Ask AI indexing outbox worker (Task 4.1) — consumes SUMMARY_CREATED / TRANSCRIPT_INDEXED
careconnect.indexing.worker.enabled=${CARECONNECT_INDEXING_WORKER_ENABLED:true}
careconnect.indexing.outbox.poll-interval-ms=${CARECONNECT_INDEXING_POLL_INTERVAL_MS:15000}
careconnect.indexing.outbox.batch-size=${CARECONNECT_INDEXING_BATCH_SIZE:25}
careconnect.indexing.outbox.max-attempts=${CARECONNECT_INDEXING_MAX_ATTEMPTS:5}
careconnect.indexing.outbox.claim-lease-minutes=${CARECONNECT_INDEXING_CLAIM_LEASE_MINUTES:10}
# Soft lease on burn-attempt deferrals/failures: claimed_at is refreshed to now().
# The claim SQL only reclaims when claimed_at < NOW() - make_interval(mins => lease),
# so a refresh starts a new ~10m window (not every 15s poll). Requires PostgreSQL 9.6+
# (make_interval); CareConnect RDS is PostgreSQL 15+.
# No-burn parks (e.g. visit summaries until Task 1.4): push claimed_at into the future so
# the claim query skips the row for this many hours instead of reclaiming every poll.
careconnect.indexing.outbox.no-burn-park-hours=${CARECONNECT_INDEXING_NO_BURN_PARK_HOURS:6}

# Task 4.3 — Bedrock Titan embeddings for retrieval_index_chunk.embedding (1536-d v1).
# Disable in tests / local without AWS. Failures leave embedding NULL for Task 4.4 backfill.
careconnect.embedding.enabled=${CARECONNECT_EMBEDDING_ENABLED:true}
careconnect.embedding.model-id=${CARECONNECT_EMBEDDING_MODEL_ID:amazon.titan-embed-text-v1}
careconnect.embedding.batch-size=${CARECONNECT_EMBEDDING_BATCH_SIZE:25}
careconnect.embedding.max-input-chars=${CARECONNECT_EMBEDDING_MAX_INPUT_CHARS:8000}
# Task 4.4 — backfill NULL embeddings (failed Bedrock, pre-4.3 rows). Worker + optional SchemaPatchRunner partial index (V2607161317).
careconnect.embedding.backfill.enabled=${CARECONNECT_EMBEDDING_BACKFILL_ENABLED:true}
careconnect.embedding.backfill.poll-interval-ms=${CARECONNECT_EMBEDDING_BACKFILL_POLL_INTERVAL_MS:60000}
careconnect.embedding.backfill.batch-size=${CARECONNECT_EMBEDDING_BACKFILL_BATCH_SIZE:50}

# Task 5.3 — POST /api/ai/ask gateway (JWT → scope → hybrid retrieval → grounded Bedrock)
careconnect.ai.ask.enabled=${CARECONNECT_AI_ASK_ENABLED:true}
careconnect.ai.hitl.enabled=${CARECONNECT_AI_HITL_ENABLED:true}
careconnect.ai.hitl.ttl-hours=${CARECONNECT_AI_HITL_TTL_HOURS:72}
careconnect.ai.hitl.expire-scan-ms=${CARECONNECT_AI_HITL_EXPIRE_SCAN_MS:300000}
careconnect.ai.hitl.expire-batch-size=${CARECONNECT_AI_HITL_EXPIRE_BATCH_SIZE:100}
careconnect.ai.ask.max-tokens=${CARECONNECT_AI_ASK_MAX_TOKENS:1024}
careconnect.ai.ask.temperature=${CARECONNECT_AI_ASK_TEMPERATURE:0.2}
careconnect.ai.ask.top-p=${CARECONNECT_AI_ASK_TOP_P:0.9}
# Task 5.5 — bounded replay of summary chunks with stale citation metadata.
careconnect.ai.citation.backfill.enabled=${CARECONNECT_AI_CITATION_BACKFILL_ENABLED:false}
careconnect.ai.citation.backfill.poll-interval-ms=${CARECONNECT_AI_CITATION_BACKFILL_POLL_INTERVAL_MS:60000}
careconnect.ai.citation.backfill.batch-size=${CARECONNECT_AI_CITATION_BACKFILL_BATCH_SIZE:25}
careconnect.ai.citation.backfill.failure-backoff-ms=${CARECONNECT_AI_CITATION_BACKFILL_FAILURE_BACKOFF_MS:300000}
careconnect.ai.citation.backfill.claim-lease-ms=${CARECONNECT_AI_CITATION_BACKFILL_CLAIM_LEASE_MS:300000}

# Task 5.1 — HybridRetrievalService (FTS + vector → RRF → top-k citations)
careconnect.ai.ask.retrieval.fts-top-k=${CARECONNECT_AI_ASK_FTS_TOP_K:20}
careconnect.ai.ask.retrieval.vector-top-k=${CARECONNECT_AI_ASK_VECTOR_TOP_K:20}
careconnect.ai.ask.retrieval.final-top-k=${CARECONNECT_AI_ASK_FINAL_TOP_K:10}
careconnect.ai.ask.retrieval.rrf-k=${CARECONNECT_AI_ASK_RRF_K:60}
# Over-fetch before in-memory consent filtering so restricted callers retain useful recall.
careconnect.ai.ask.retrieval.visibility-overfetch-factor=${CARECONNECT_AI_ASK_VISIBILITY_OVERFETCH_FACTOR:3}
# Prevent one indexed source from crowding all other sources out of the final citations.
careconnect.ai.ask.retrieval.max-chunks-per-source=${CARECONNECT_AI_ASK_MAX_CHUNKS_PER_SOURCE:2}
# pgvector ivfflat recall depends on ivfflat.probes (PostgreSQL default: 1).
# Set an appropriate session/database value in production (for example 10) and validate with EXPLAIN.

# Chime live transcription (required for realtime transcript sentiment events)
careconnect.chime.transcription.enabled=${CARECONNECT_CHIME_TRANSCRIPTION_ENABLED:true}
careconnect.chime.transcription.language-code=${CARECONNECT_CHIME_TRANSCRIPTION_LANGUAGE:en-US}
careconnect.chime.transcription.region=${CARECONNECT_CHIME_TRANSCRIPTION_REGION:us-east-1}

# ── Call Recording (AWS Chime Media Capture Pipelines → S3) ──────────────────
#
# Enable:  set CARECONNECT_RECORDING_ENABLED=true  (local dev or Fargate task env)
#
# The following are provisioned AUTOMATICALLY at startup — no manual config needed:
#   • S3 bucket:  careconnect-recordings-{accountId}-{region}  (created if absent)
#   • Bucket policy granting chime.amazonaws.com write access  (applied on every start)
#   • IAM service-linked role: AWSServiceRoleForAmazonChimeSDKMediaPipelines
#
# REQUIRED IAM permissions on the AWS user / Fargate task role:
#   iam:CreateServiceLinkedRole   — Resource: arn:aws:iam::*:role/aws-service-role/mediapipelines.chime.amazonaws.com/*
#   s3:CreateBucket               — Resource: arn:aws:s3:::careconnect-recordings-*
#   s3:PutBucketPolicy            — Resource: arn:aws:s3:::careconnect-recordings-*
#   s3:PutObject                  — Resource: arn:aws:s3:::careconnect-recordings-*/*
#   s3:GetObject                  — Resource: arn:aws:s3:::careconnect-recordings-*/*
#   s3:ListBucket                 — Resource: arn:aws:s3:::careconnect-recordings-*
#   s3:DeleteObject               — Resource: arn:aws:s3:::careconnect-recordings-*/*  (for dev purge)
#   chime:CreateMediaCapturePipeline
#   chime:CreateMediaConcatenationPipeline
#   chime:DeleteMediaCapturePipeline
#   chime:GetMediaPipeline
#   chime:GetMediaCapturePipeline
#
# IF iam:CreateServiceLinkedRole is missing, run ONCE manually (any team member, any machine):
#   aws iam create-service-linked-role --aws-service-name mediapipelines.chime.amazonaws.com
# This is a one-time per-AWS-account operation — it does not need to be repeated.
#
# ── Speaker ID / KVS (ingest + polling discovery) ───────────────────
# Local dev uses the IAM user in .env (NOT EcsTaskRole). Required when CARECONNECT_KVS_ENABLED=true:
#   chime:CreateMediaStreamPipeline, chime:DeleteMediaPipeline, chime:GetMediaPipeline
#   chime:CreateMediaInsightsPipeline, chime:DeleteMediaInsightsPipeline, chime:GetMediaInsightsPipeline
#   kinesisvideo:ListStreams, kinesisvideo:ListFragments, kinesisvideo:GetDataEndpoint,
#   kinesisvideo:GetMedia, kinesisvideo:DescribeStream
#   Resource: arn:aws:kinesisvideo:us-east-1:{accountId}:stream/*
# (Same as cloudformation-fargate/templates/03-platform.yaml EcsTaskRole KinesisVideoStreams sid.)
careconnect.kvs.enabled=${CARECONNECT_KVS_ENABLED:false}
careconnect.kvs.stream-pool-arn=${CARECONNECT_KVS_STREAM_POOL_ARN:}
careconnect.kvs.stream-arns=${CARECONNECT_KVS_STREAM_ARNS:}
careconnect.kvs.stream-discovery-timeout-ms=${CARECONNECT_KVS_STREAM_DISCOVERY_TIMEOUT_MS:60000}
careconnect.kvs.stream-discovery-poll-interval-ms=${CARECONNECT_KVS_STREAM_DISCOVERY_POLL_INTERVAL_MS:3000}
careconnect.kvs.event-webhook.enabled=${CARECONNECT_KVS_EVENT_WEBHOOK_ENABLED:false}
# Optional EventBridge fast-path only; KVS polling is the primary attendee→stream discovery path.
careconnect.chime.media-insights-config-arn=${CARECONNECT_CHIME_MEDIA_INSIGHTS_CONFIG_ARN:}

careconnect.recording.enabled=${CARECONNECT_RECORDING_ENABLED:false}
careconnect.recording.presigned-url-ttl-minutes=${CARECONNECT_RECORDING_PRESIGNED_TTL_MINUTES:15}
careconnect.recording.raw-cleanup.enabled=${CARECONNECT_RECORDING_RAW_CLEANUP_ENABLED:true}
careconnect.recording.raw-cleanup.interval-ms=${CARECONNECT_RECORDING_RAW_CLEANUP_INTERVAL_MS:60000}
careconnect.recording.cors-allow-wildcard=${CARECONNECT_RECORDING_CORS_ALLOW_WILDCARD:true}
# Destructive global purge remains off unless explicitly enabled in a dev/local/test profile.
careconnect.recording.global-purge-enabled=${CARECONNECT_RECORDING_GLOBAL_PURGE_ENABLED:false}

# Transcript archival for long calls (PHI stays private in encrypted S3; DB keeps only metadata pointer)
app.call.transcript.archive.enabled=${CARECONNECT_CALL_TRANSCRIPT_ARCHIVE_ENABLED:true}
app.call.transcript.archive.min-segments=${CARECONNECT_CALL_TRANSCRIPT_ARCHIVE_MIN_SEGMENTS:600}
app.call.transcript.archive.min-chars=${CARECONNECT_CALL_TRANSCRIPT_ARCHIVE_MIN_CHARS:120000}
app.call.transcript.archive.delete-db-after-archive=${CARECONNECT_CALL_TRANSCRIPT_ARCHIVE_DELETE_DB_AFTER:true}
app.call.transcript.archive.deletion-max-attempts=${CARECONNECT_CALL_TRANSCRIPT_ARCHIVE_DELETION_MAX_ATTEMPTS:8}
careconnect.call.transcript.post-call-upload-grace-seconds=${CARECONNECT_CALL_TRANSCRIPT_UPLOAD_GRACE_SECONDS:120}

careconnect.websocket.endpoint=/ws/careconnect
careconnect.websocket.connection-ttl-minutes=120

#ALEXA OAUTH Configuration
# NOTE: Alexa OAuth credentials must be set via environment variables in production.
# Google Places API key must be set via GOOGLE_PLACES_API_KEY environment variable.
# See deployment guide for required environment variable configuration.
alexa.oauth.client-id=${ALEXA_CLIENT_ID:alexa-careconnect-client}
alexa.oauth.client-secret=${ALEXA_CLIENT_SECRET:}
google.places.api-key=${GOOGLE_PLACES_API_KEY:}

# Serialize LocalDateTime/LocalDate as ISO-8601 strings (not arrays)
spring.jackson.serialization.write-dates-as-timestamps=false

#Bedrock Integration
careconnect.llm.enabled=${CARECONNECT_LLM_ENABLED:false}

# ACTUATOR CONFIGURATION (HEALTH CHECKS)
# Expose only the health endpoint over HTTP
# (keeps surface area minimal for security)
management.endpoints.web.exposure.include=health

# Always show health details (useful for CI/CD + debugging)
