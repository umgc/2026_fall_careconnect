# Enable SSM Parameter Store for secrets in production
context.initializer.classes=com.careconnect.config.SsmPropertySourceInitializer
careconnect.aws.enabled=true

# CareConnect Email Configuration for SendGrid API
careconnect.email.provider=sendgrid
careconnect.email.sendgrid.api-key=${SENDGRID_API_KEY}
careconnect.email.from=${FROM_EMAIL}

# WebSocket Configuration - AWS Production (Lambda + API Gateway)
careconnect.websocket.enabled=true
careconnect.websocket.mode=aws
careconnect.websocket.aws.api-gateway-endpoint=${AWS_WEBSOCKET_API_GATEWAY_ENDPOINT}
careconnect.websocket.aws.region=${AWS_DEFAULT_REGION:us-east-1}
careconnect.websocket.connection-ttl-minutes=120
careconnect.websocket.cleanup-interval-minutes=15

# Disable API docs in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Ask AI — enabled in ECS via CARECONNECT_AI_ENABLED (P0 deploy unblock)
careconnect.ai.enabled=${CARECONNECT_AI_ENABLED:true}
careconnect.ai.provider=${AI_PROVIDER:bedrock}

# --- Database schema (production / ECS) ---
# Production does NOT use Flyway. Schema is applied at container startup via:
#   1. SchemaPatchRunner — idempotent JDBC patches (see SchemaPatchRunner.java)
#   2. Hibernate ddl-auto — ECS sets SPRING_JPA_HIBERNATE_DDL_AUTO=update
#   3. JPA @Entity mapping — creates/alters tables from entity definitions
# SQL files under db/migration/ are the canonical reference; add equivalent patches to
# SchemaPatchRunner when deploying new schema to production.
spring.flyway.enabled=false
