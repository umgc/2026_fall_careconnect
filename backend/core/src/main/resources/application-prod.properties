# Enable SSM Parameter Store for secrets in production
context.initializer.classes=com.careconnect.config.SsmPropertySourceInitializer
careconnect.aws.enabled=true

# CareConnect Email Configuration for SendGrid API
careconnect.email.provider=sendgrid
careconnect.email.sendgrid.api-key=${SENDGRID_API_KEY}
careconnect.email.from=${FROM_EMAIL}

# WebSocket Configuration - AWS Production (Lambda + API Gateway)
# Empty default: AwsWebSocketService only loads when a real endpoint is set via env/ECS.
careconnect.websocket.enabled=true
careconnect.websocket.mode=aws
careconnect.websocket.aws.api-gateway-endpoint=${AWS_WEBSOCKET_API_GATEWAY_ENDPOINT:}
careconnect.websocket.aws.region=${AWS_DEFAULT_REGION:us-east-1}
careconnect.websocket.connection-ttl-minutes=120
careconnect.websocket.cleanup-interval-minutes=15

# Disable API docs in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Ask AI — enabled in ECS via CARECONNECT_AI_ENABLED (P0 deploy unblock)
careconnect.ai.enabled=${CARECONNECT_AI_ENABLED:true}
careconnect.ai.provider=${AI_PROVIDER:bedrock}

# --- Database schema (production / ECS) ---
# Production does NOT use Flyway. Schema is applied at container startup via:
#   1. Hibernate ddl-auto=update — creates/alters tables from @Entity classes
#   2. SchemaPatchRunner — idempotent JDBC patches (indexes, extensions, FKs Hibernate
#      will not create; see SchemaPatchRunner.java)
# SQL files under db/migration/ are the canonical reference. SchemaPatchRunner mirrors
# those patches. Flyway must remain disabled; CloudFormation also sets
# SPRING_FLYWAY_ENABLED=false and SPRING_JPA_HIBERNATE_DDL_AUTO=update.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

# --- DataSource (values injected by the ECS task definition) ---
# DatabaseConfig is gated on careconnect.database.use-aws-config=true and reads
# its values as SSM parameter NAMES. ECS injects literal values instead
# (JDBC_URI / DB_USER from data-stack exports, DB_PASSWORD from Secrets Manager),
# so this profile uses standard Spring Boot autoconfiguration like dev and test.
# No localhost fallbacks: in ECS a missing JDBC_URI must fail loudly rather than
# silently point at a database that isn't there.
careconnect.database.use-aws-config=false
spring.datasource.url=${JDBC_URI}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
