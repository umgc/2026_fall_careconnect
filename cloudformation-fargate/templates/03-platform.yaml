AWSTemplateFormatVersion: '2010-09-09'
Description: CareConnect platform stack for ECR, ECS cluster, roles, and logs.

Parameters:
  # Environment name drives resource naming and exports.
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - cfdemo
      - staging
      - prod

  # Repo name can be made unique per environment when running parallel stacks.
  RepositoryName:
    Type: String
    Default: careconnect-backend

  # Log retention for the backend container log group.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365

  # One-time Chime Media Insights configuration ARN (empty until ops creates the config).
  MediaInsightsConfigArn:
    Type: String
    Default: ''
    Description: >
      ARN of the Chime Media Insights pipeline configuration for per-attendee speaker capture.
      Create the configuration in AWS once, then pass the ARN on stack create/update.

Resources:
  # Backend image repository.
  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: false

  # Log group used by the ECS task definition.
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/careconnect-backend-${Environment}
      RetentionInDays: !Ref LogRetentionDays

  # ECS cluster that will host the Fargate service.
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub careconnect-${Environment}-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  # Execution role: image pull, logs, secrets read.
  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub careconnect-${Environment}-ecsTaskExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: !Sub careconnect-${Environment}-ecs-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/careconnect/${Environment}/*

  # Task role: runtime permissions for Chime, recording, KVS speaker capture,
  # Bedrock, S3, Transcribe, SSM (prod profile), and related AWS SDK clients.
  # See cloudformation-fargate/README.md — ECS task role permissions.
  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub careconnect-${Environment}-ecsTaskRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub careconnect-${Environment}-ecs-task-app
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ChimeMeetings
                Effect: Allow
                Action:
                  - chime:CreateMeeting
                  - chime:DeleteMeeting
                  - chime:GetMeeting
                  - chime:ListMeetings
                  - chime:CreateAttendee
                  - chime:DeleteAttendee
                  - chime:GetAttendee
                  - chime:ListAttendees
                  - chime:StartMeetingTranscription
                  - chime:StopMeetingTranscription
                  - chime:GetMeetingTranscriptionStatus
                Resource: '*'
              - Sid: ChimeMediaPipelines
                Effect: Allow
                Action:
                  - chime:CreateMediaCapturePipeline
                  - chime:CreateMediaConcatenationPipeline
                  - chime:DeleteMediaCapturePipeline
                  - chime:DeleteMediaPipeline
                  - chime:GetMediaCapturePipeline
                  - chime:GetMediaPipeline
                  - chime:CreateMediaStreamPipeline
                  - chime:CreateMediaInsightsPipeline
                  - chime:DeleteMediaInsightsPipeline
                  - chime:GetMediaInsightsPipeline
                  - chime:CreateMediaInsightsPipelineConfiguration
                  - chime:GetMediaInsightsPipelineConfiguration
                  - chime:ListMediaInsightsPipelineConfigurations
                Resource: '*'
              - Sid: KinesisVideoStreams
                Effect: Allow
                Action:
                  - kinesisvideo:CreateStream
                  - kinesisvideo:DescribeStream
                  - kinesisvideo:GetDataEndpoint
                  - kinesisvideo:GetMedia
                  - kinesisvideo:GetMediaForFragmentList
                  - kinesisvideo:PutMedia
                  - kinesisvideo:TagStream
                  - kinesisvideo:ListStreams
                  - kinesisvideo:ListFragments
                Resource: !Sub arn:aws:kinesisvideo:${AWS::Region}:${AWS::AccountId}:stream/*
              - Sid: S3CareConnectBuckets
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:PutBucketPolicy
                  - s3:PutBucketCors
                  - s3:GetBucketAcl
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:PutObjectAcl
                  - s3:DeleteObject
                Resource:
                  - arn:aws:s3:::careconnect-recordings-*
                  - arn:aws:s3:::careconnect-recordings-*/*
                  - arn:aws:s3:::careconnect-uploads-*
                  - arn:aws:s3:::careconnect-uploads-*/*
              - Sid: BedrockInvoke
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  # Named allow-list (Task 4.3 Titan v1 + chat/summary models); prefer least privilege
                  # over foundation-model/* from deploy-permissions merge into develop.
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-pro-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v1
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/mistral.voxtral-small-24b-2507
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-5-sonnet-20240620-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-sonnet-4-20250514-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-sonnet-4-6
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
              - Sid: TranscribeJobs
                Effect: Allow
                Action:
                  - transcribe:StartTranscriptionJob
                  - transcribe:GetTranscriptionJob
                  - transcribe:DeleteTranscriptionJob
                  - transcribe:ListTranscriptionJobs
                Resource: '*'
              - Sid: TextractOcr
                Effect: Allow
                Action:
                  - textract:StartDocumentTextDetection
                  - textract:GetDocumentTextDetection
                  - textract:DetectDocumentText
                Resource: '*'
              - Sid: Notifications
                Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                  - sns:Publish
                Resource: '*'
              # Covers kvs-stream-arns, chime-media-insights-config-arn, and other env SSM params.
              - Sid: SsmParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/careconnect/${Environment}/*
              # SecureString GetParameter (withDecryption=true) needs kms:Decrypt on the SSM CMK.
              - Sid: KmsDecryptViaSsm
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
              - Sid: IamChimeMediaPipelinesServiceLinkedRole
                Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                Resource: arn:aws:iam::*:role/aws-service-role/mediapipelines.chime.amazonaws.com/*
                Condition:
                  StringEquals:
                    iam:AWSServiceName: mediapipelines.chime.amazonaws.com
              - Sid: StsGetCallerIdentity
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: '*'

  # Pre-provisioned KVS streams for per-attendee speaker capture (pool checkout in app).
  KvsSpeakerStream01:
    Type: AWS::KinesisVideo::Stream
    Properties:
      Name: !Sub careconnect-${Environment}-kvs-01
      DataRetentionInHours: 24
  KvsSpeakerStream02:
    Type: AWS::KinesisVideo::Stream
    Properties:
      Name: !Sub careconnect-${Environment}-kvs-02
      DataRetentionInHours: 24
  KvsSpeakerStream03:
    Type: AWS::KinesisVideo::Stream
    Properties:
      Name: !Sub careconnect-${Environment}-kvs-03
      DataRetentionInHours: 24
  KvsSpeakerStream04:
    Type: AWS::KinesisVideo::Stream
    Properties:
      Name: !Sub careconnect-${Environment}-kvs-04
      DataRetentionInHours: 24
  KvsSpeakerStream05:
    Type: AWS::KinesisVideo::Stream
    Properties:
      Name: !Sub careconnect-${Environment}-kvs-05
      DataRetentionInHours: 24
  KvsSpeakerStream06:
    Type: AWS::KinesisVideo::Stream
    Properties:
      Name: !Sub careconnect-${Environment}-kvs-06
      DataRetentionInHours: 24
  KvsSpeakerStream07:
    Type: AWS::KinesisVideo::Stream
    Properties:
      Name: !Sub careconnect-${Environment}-kvs-07
      DataRetentionInHours: 24
  KvsSpeakerStream08:
    Type: AWS::KinesisVideo::Stream
    Properties:
      Name: !Sub careconnect-${Environment}-kvs-08
      DataRetentionInHours: 24
  KvsSpeakerStream09:
    Type: AWS::KinesisVideo::Stream
    Properties:
      Name: !Sub careconnect-${Environment}-kvs-09
      DataRetentionInHours: 24
  KvsSpeakerStream10:
    Type: AWS::KinesisVideo::Stream
    Properties:
      Name: !Sub careconnect-${Environment}-kvs-10
      DataRetentionInHours: 24

  KvsStreamArnsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /careconnect/${Environment}/kvs-stream-arns
      Type: String
      Description: Comma-separated KVS stream ARNs for speaker-ID pool checkout
      Value: !Join
        - ','
        - - !GetAtt KvsSpeakerStream01.Arn
          - !GetAtt KvsSpeakerStream02.Arn
          - !GetAtt KvsSpeakerStream03.Arn
          - !GetAtt KvsSpeakerStream04.Arn
          - !GetAtt KvsSpeakerStream05.Arn
          - !GetAtt KvsSpeakerStream06.Arn
          - !GetAtt KvsSpeakerStream07.Arn
          - !GetAtt KvsSpeakerStream08.Arn
          - !GetAtt KvsSpeakerStream09.Arn
          - !GetAtt KvsSpeakerStream10.Arn

  ChimeMediaInsightsConfigArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /careconnect/${Environment}/chime-media-insights-config-arn
      Type: String
      Description: Chime Media Insights pipeline configuration ARN for speaker-ID capture
      Value: !Ref MediaInsightsConfigArn

Outputs:
  # Exported outputs are consumed by the service stack.
  EcrRepositoryUri:
    Value: !GetAtt BackendRepository.RepositoryUri
    Export:
      Name: !Sub careconnect-${Environment}-EcrRepositoryUri

  EcrRepositoryName:
    Value: !Ref BackendRepository
    Export:
      Name: !Sub careconnect-${Environment}-EcrRepositoryName

  EcsClusterName:
    Value: !Ref EcsCluster
    Export:
      Name: !Sub careconnect-${Environment}-EcsClusterName

  EcsClusterArn:
    Value: !GetAtt EcsCluster.Arn
    Export:
      Name: !Sub careconnect-${Environment}-EcsClusterArn

  EcsTaskExecutionRoleArn:
    Value: !GetAtt EcsTaskExecutionRole.Arn
    Export:
      Name: !Sub careconnect-${Environment}-EcsTaskExecutionRoleArn

  EcsTaskRoleArn:
    Value: !GetAtt EcsTaskRole.Arn
    Export:
      Name: !Sub careconnect-${Environment}-EcsTaskRoleArn

  BackendLogGroupName:
    Value: !Ref BackendLogGroup
    Export:
      Name: !Sub careconnect-${Environment}-BackendLogGroupName

  KvsStreamArnsParameterName:
    Value: !Ref KvsStreamArnsParameter
    Export:
      Name: !Sub careconnect-${Environment}-KvsStreamArnsParameterName

  KvsStreamPoolSize:
    Value: '10'
    Export:
      Name: !Sub careconnect-${Environment}-KvsStreamPoolSize

  ChimeMediaInsightsConfigArnParameterName:
    Value: !Ref ChimeMediaInsightsConfigArnParameter
    Export:
      Name: !Sub careconnect-${Environment}-ChimeMediaInsightsConfigArnParameterName
