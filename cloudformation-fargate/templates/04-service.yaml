AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CareConnect ECS Fargate service with API Gateway HTTP API, VPC Link,
  Cloud Map service discovery, ACM certificate, Route 53 custom domain, and an
  API Gateway WebSocket API reaching the service through an internal NLB.

Parameters:
  # Environment name must match the networking, data, and platform stacks.
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - cfdemo
      - staging
      - prod

  # Full repository URI with tag, for example:
  # 123456789012.dkr.ecr.us-east-1.amazonaws.com/careconnect-backend-cfdemo:cfdemo
  BackendImageUri:
    Type: String
    Description: Full ECR image URI including tag

  # Spring profile: use prod for cfdemo/staging/prod (SSM, SendGrid, AI); dev for local cloud experiments.
  SpringProfile:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod

  # Enables AIChatController and Bedrock chat beans (maps to CARECONNECT_AI_ENABLED).
  # Default true matches SpringProfile default prod; dev-service.json sets false explicitly.
  CareConnectAiEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  # Gates LlmExtractionService / HomeCareLlmExtractionService
  # (@ConditionalOnProperty careconnect.llm.enabled). InvoiceController is
  # created whenever careconnect.aws.enabled=true and needs that bean.
  CareConnectLlmEnabled:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  # Bedrock provider flag passed through to AI_PROVIDER.
  AiProvider:
    Type: String
    Default: bedrock

  # Bedrock model ID passed through to AI_MODEL, overriding the Java default
  # (anthropic.claude-sonnet-4-5-20250929-v1:0). Defaults to Nova Lite because
  # Claude inference for this account is only available out of us-west-2 while
  # this stack deploys to us-east-1/us-east-2 — override once Claude access is
  # sorted out for this region.
  AiModel:
    Type: String
    Default: amazon.nova-lite-v1:0

  # SendGrid from-address for prod profile email (API key loaded from SSM when SpringProfile=prod).
  FromEmail:
    Type: String
    Default: noreply@careconnect.com

  # Used by backend auth / redirect flows and some generated links.
  FrontendBaseUrl:
    Type: String
    Default: http://localhost:3000

  # Passed through to careconnect.cors_allowed.
  CorsAllowedList:
    Type: String
    Default: http://localhost:*,http://127.0.0.1:*

  # The backend currently binds to 8081 in ECS.
  ContainerPort:
    Type: Number
    Default: 8081

  # Second backend port that only the internal WebSocket NLB can reach. The API Gateway
  # WebSocket API calls back here; the public HTTP API never reaches it.
  InternalWebSocketPort:
    Type: Number
    Default: 8082

  # Start small for demo. Must stay 1 while websocket sessions live in task memory
  # (ApiGatewaySessionRegistry): every message for a connection has to reach the same task.
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 1
    ConstraintDescription: >-
      Must be 0 or 1. Websocket sessions are held in task memory; scaling out first needs
      the session registry moved to the database.

  # ECS/Fargate task sizing.
  TaskCpu:
    Type: String
    Default: '1024'
    AllowedValues:
      - '256'
      - '512'
      - '1024'
      - '2048'
      - '4096'

  # Fargate memory must be valid for the chosen CPU value.
  TaskMemory:
    Type: String
    Default: '3072'

  # Public health endpoint used by Cloud Map health checks.
  HealthCheckPath:
    Type: String
    Default: /v1/api/test/health

  # Custom domain name for API Gateway (e.g., api.careconnect.example.com).
  # Leave empty to skip Route 53 and ACM resources (API Gateway will still
  # provide its default execute-api endpoint).
  DomainName:
    Type: String
    Default: ''
    Description: Custom domain name for the API (leave empty to use default API Gateway URL)

  # Route 53 hosted zone ID for the custom domain.
  # Required only when DomainName is provided.
  HostedZoneId:
    Type: String
    Default: ''
    Description: Route 53 Hosted Zone ID (required if DomainName is set)

Conditions:
  # Only create custom domain resources when a domain name is provided.
  HasCustomDomain: !Not [!Equals [!Ref DomainName, '']]
  IsProdProfile: !Equals [!Ref SpringProfile, 'prod']

Resources:
  # ---------------------------------------------------------------------------
  # Cloud Map namespace and service for ECS service discovery.
  # API Gateway VPC Link routes traffic through Cloud Map to ECS tasks.
  # ---------------------------------------------------------------------------

  # Private DNS namespace used by Cloud Map for service discovery within the VPC.
  CloudMapNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Sub careconnect-${Environment}.local
      Vpc:
        Fn::ImportValue: !Sub careconnect-${Environment}-VpcId
      Description: !Sub CareConnect ${Environment} service discovery namespace

  # Cloud Map service registered by ECS for task instance discovery.
  CloudMapService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: backend
      NamespaceId: !Ref CloudMapNamespace
      DnsConfig:
        DnsRecords:
          - Type: SRV
            TTL: 15
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1

  # ---------------------------------------------------------------------------
  # API Gateway HTTP API with VPC Link integration.
  # ---------------------------------------------------------------------------

  # VPC Link allows API Gateway to reach resources in the VPC (ECS tasks).
  VpcLink:
    Type: AWS::ApiGatewayV2::VpcLink
    Properties:
      Name: !Sub careconnect-${Environment}-vpc-link
      SubnetIds:
        - Fn::ImportValue: !Sub careconnect-${Environment}-PublicSubnetAId
        - Fn::ImportValue: !Sub careconnect-${Environment}-PublicSubnetBId
      SecurityGroupIds:
        - Fn::ImportValue: !Sub careconnect-${Environment}-VpcLinkSecurityGroupId

  # HTTP API (cheaper and simpler than REST API, supports JWT authorizers natively).
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub careconnect-${Environment}-api
      ProtocolType: HTTP
      Description: !Sub CareConnect ${Environment} backend API
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Requested-With
        MaxAge: 86400

  # Default integration pointing to the Cloud Map service via VPC Link.
  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      ConnectionType: VPC_LINK
      ConnectionId: !Ref VpcLink
      IntegrationUri: !GetAtt CloudMapService.Arn
      PayloadFormatVersion: '1.0'

  # Catch-all route that forwards every request to the backend.
  HttpApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: '$default'
      Target: !Sub integrations/${HttpApiIntegration}

  # Auto-deploy stage so changes are live immediately.
  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

  # ---------------------------------------------------------------------------
  # ACM Certificate + Custom Domain + Route 53 (conditional on DomainName).
  # ---------------------------------------------------------------------------

  # ACM certificate for HTTPS on the custom domain. DNS validation is used.
  AcmCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Name
          Value: !Sub careconnect-${Environment}-api-cert

  # API Gateway custom domain name bound to the ACM certificate.
  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - EndpointType: REGIONAL
          CertificateArn: !Ref AcmCertificate

  # Maps the custom domain to the HTTP API default stage.
  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasCustomDomain
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomainName
      Stage: !Ref HttpApiStage

  # Route 53 alias record pointing the custom domain to the API Gateway.
  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiDomainName.RegionalDomainName
        HostedZoneId: !GetAtt ApiDomainName.RegionalHostedZoneId

  # ---------------------------------------------------------------------------
  # API Gateway WebSocket API.
  # HTTP APIs cannot carry websocket traffic, so websockets use a separate
  # WebSocket API. API Gateway holds the client sockets and turns each
  # connect / message / disconnect into an HTTP POST to the backend's internal
  # port. WebSocket APIs reach a VPC only through a VPC Link V1, which only
  # targets an NLB — hence the internal NLB below.
  # Clients connect to wss://<api-id>.execute-api.<region>.amazonaws.com/<env>?channel=<name>.
  # ---------------------------------------------------------------------------

  # NLB security group: may only send to the tasks (internal port + health check).
  # Inbound PrivateLink traffic from API Gateway is not evaluated (see NLB below).
  WsNlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal websocket NLB to ECS tasks
      VpcId:
        Fn::ImportValue: !Sub careconnect-${Environment}-VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: !Ref InternalWebSocketPort
          ToPort: !Ref InternalWebSocketPort
          DestinationSecurityGroupId:
            Fn::ImportValue: !Sub careconnect-${Environment}-EcsTaskSecurityGroupId
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          DestinationSecurityGroupId:
            Fn::ImportValue: !Sub careconnect-${Environment}-EcsTaskSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub careconnect-${Environment}-ws-nlb-sg

  # Tasks accept the websocket callbacks only from the NLB.
  EcsTaskIngressFromWsNlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub careconnect-${Environment}-EcsTaskSecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref InternalWebSocketPort
      ToPort: !Ref InternalWebSocketPort
      SourceSecurityGroupId: !Ref WsNlbSecurityGroup
      Description: API Gateway websocket callbacks via internal NLB

  # NLB health checks hit the public health endpoint on the main port.
  EcsTaskHealthCheckFromWsNlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub careconnect-${Environment}-EcsTaskSecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref ContainerPort
      ToPort: !Ref ContainerPort
      SourceSecurityGroupId: !Ref WsNlbSecurityGroup
      Description: Websocket NLB health checks

  # Internal (no public IPs) NLB in the private subnets. Security-group evaluation
  # of PrivateLink traffic is off, as AWS requires for API Gateway VPC Links.
  WsNlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub careconnect-${Environment}-ws-nlb
      Type: network
      Scheme: internal
      Subnets:
        - Fn::ImportValue: !Sub careconnect-${Environment}-PrivateDbSubnetAId
        - Fn::ImportValue: !Sub careconnect-${Environment}-PrivateDbSubnetBId
      SecurityGroups:
        - !Ref WsNlbSecurityGroup
      EnforceSecurityGroupInboundRulesOnPrivateLinkTraffic: 'off'
      LoadBalancerAttributes:
        - Key: load_balancing.cross_zone.enabled
          Value: 'true'

  # Targets are the task IPs on the internal port; health is the main port's health path.
  WsTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub careconnect-${Environment}-ws-tg
      TargetType: ip
      Protocol: TCP
      Port: !Ref InternalWebSocketPort
      VpcId:
        Fn::ImportValue: !Sub careconnect-${Environment}-VpcId
      HealthCheckProtocol: HTTP
      HealthCheckPort: !Sub '${ContainerPort}'
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  WsNlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref WsNlb
      Port: !Ref InternalWebSocketPort
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WsTargetGroup

  # VPC Link V1 (REST-style). Creation takes several minutes.
  WsVpcLink:
    Type: AWS::ApiGateway::VpcLink
    Properties:
      Name: !Sub careconnect-${Environment}-ws-vpc-link
      Description: API Gateway WebSocket API to the internal websocket NLB
      TargetArns:
        - !Ref WsNlb

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub careconnect-${Environment}-ws
      ProtocolType: WEBSOCKET
      Description: !Sub CareConnect ${Environment} websocket API
      # Only $connect/$default/$disconnect are used; the backend dispatches on the
      # message's own "type" field, so no custom route keys are needed.
      RouteSelectionExpression: $request.body.action

  # Each integration forwards to the backend callback endpoint, adding the
  # connection id (and, on connect, the requested channel) as headers.
  WsConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: POST
      ConnectionType: VPC_LINK
      ConnectionId: !Ref WsVpcLink
      IntegrationUri: !Sub http://${WsNlb.DNSName}:${InternalWebSocketPort}/api/internal/ws/connect
      RequestParameters:
        integration.request.header.X-Ws-Connection-Id: context.connectionId
        integration.request.header.X-Ws-Channel: route.request.querystring.channel

  WsMessageIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: POST
      ConnectionType: VPC_LINK
      ConnectionId: !Ref WsVpcLink
      IntegrationUri: !Sub http://${WsNlb.DNSName}:${InternalWebSocketPort}/api/internal/ws/message
      RequestParameters:
        integration.request.header.X-Ws-Connection-Id: context.connectionId

  WsDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: POST
      ConnectionType: VPC_LINK
      ConnectionId: !Ref WsVpcLink
      IntegrationUri: !Sub http://${WsNlb.DNSName}:${InternalWebSocketPort}/api/internal/ws/disconnect
      RequestParameters:
        integration.request.header.X-Ws-Connection-Id: context.connectionId

  # The channel query string is required; the backend also rejects unknown values.
  WsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      RequestParameters:
        route.request.querystring.channel:
          Required: true
      Target: !Sub integrations/${WsConnectIntegration}

  WsDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      AuthorizationType: NONE
      Target: !Sub integrations/${WsMessageIntegration}

  WsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub integrations/${WsDisconnectIntegration}

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref Environment
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  # Lets the backend push to and close connections (@connections API) on this stage only.
  WebSocketManageConnectionsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub careconnect-${Environment}-ws-manage-connections
      Roles:
        - !Sub careconnect-${Environment}-ecsTaskRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: execute-api:ManageConnections
            Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/${Environment}/*/@connections/*

  # ---------------------------------------------------------------------------
  # ECS Task Definition and Service.
  # ---------------------------------------------------------------------------

  # ECS task definition tied to the runtime contract used by the backend code.
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub careconnect-${Environment}-backend
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn:
        Fn::ImportValue: !Sub careconnect-${Environment}-EcsTaskExecutionRoleArn
      TaskRoleArn:
        Fn::ImportValue: !Sub careconnect-${Environment}-EcsTaskRoleArn
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ContainerDefinitions:
        - Name: cc-backend
          Image: !Ref BackendImageUri
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              HostPort: !Ref ContainerPort
              Protocol: tcp
              AppProtocol: http
              Name: backend-port
            - ContainerPort: !Ref InternalWebSocketPort
              HostPort: !Ref InternalWebSocketPort
              Protocol: tcp
              Name: websocket-callback-port
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub careconnect-${Environment}-BackendLogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            # Non-secret runtime configuration.
            - Name: SPRING_PROFILES_ACTIVE
              Value: !Ref SpringProfile
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: SERVER_PORT
              Value: !Sub '${ContainerPort}'
            - Name: JDBC_URI
              Value:
                Fn::ImportValue: !Sub careconnect-${Environment}-DatabaseJdbcUri
            - Name: DB_USER
              Value:
                Fn::ImportValue: !Sub careconnect-${Environment}-DatabaseUsername
            - Name: APP_FRONTEND_BASE_URL
              Value: !Ref FrontendBaseUrl
            - Name: CORS_ALLOWED_LIST
              Value: !Ref CorsAllowedList
            # Ask AI / Bedrock (Task 0.1 P0 deploy unblock)
            - Name: CARECONNECT_AI_ENABLED
              Value: !Ref CareConnectAiEnabled
            - Name: AI_PROVIDER
              Value: !Ref AiProvider
            - Name: AI_MODEL
              Value: !Ref AiModel
            - Name: CARECONNECT_LLM_ENABLED
              Value: !Ref CareConnectLlmEnabled
            # Prod profile email (SendGrid API key via SSM; dev profile ignores these)
            - Name: EMAIL_PROVIDER
              Value: !If [IsProdProfile, 'sendgrid', 'console']
            - Name: FROM_EMAIL
              Value: !If [IsProdProfile, !Ref FromEmail, 'dev@localhost']
            # Prod profile WebSocket (application-prod.properties AWS mode): the
            # @connections callback URL of the WebSocket API stage above.
            - Name: WEBSOCKET_ENABLED
              Value: !If [IsProdProfile, 'true', 'false']
            - Name: WEBSOCKET_MODE
              Value: aws
            - Name: AWS_WEBSOCKET_API_GATEWAY_ENDPOINT
              Value: !Sub https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
            - Name: WEBSOCKET_INTERNAL_PORT
              Value: !Sub '${InternalWebSocketPort}'
            # Production schema: Flyway off; SchemaPatchRunner + Hibernate ddl-auto=update at startup.
            - Name: SPRING_FLYWAY_ENABLED
              Value: 'false'
            - Name: SPRING_JPA_HIBERNATE_DDL_AUTO
              Value: update
            - Name: CARECONNECT_RECORDING_ENABLED
              Value: 'true'
            - Name: CARECONNECT_KVS_ENABLED
              Value: 'true'
            - Name: CARECONNECT_KVS_STREAM_POOL_ARN
              Value: !Sub '{{resolve:ssm:/careconnect/${Environment}/kvs-stream-pool-arn}}'
            - Name: CARECONNECT_KVS_EVENT_WEBHOOK_ENABLED
              Value: 'true'
            # Must match ChimeKvsStreamDiscoveryConnection ApiKeyValue (X-EventBridge-Connection).
            - Name: CARECONNECT_KVS_EVENT_WEBHOOK_SHARED_SECRET
              Value: !Sub 'careconnect-${Environment}-kvs-discovery'
          Secrets:
            # Secret injection from the data stack.
            - Name: DB_PASSWORD
              ValueFrom:
                Fn::ImportValue: !Sub careconnect-${Environment}-DatabasePasswordSecretArn
            - Name: SECURITY_JWT_SECRET
              ValueFrom:
                Fn::ImportValue: !Sub careconnect-${Environment}-JwtSecretArn

  # ECS Fargate service registered with Cloud Map for API Gateway discovery
  # and with the websocket NLB target group for the WebSocket API.
  EcsService:
    Type: AWS::ECS::Service
    DependsOn: WsNlbListener
    Properties:
      ServiceName: !Sub careconnect-${Environment}-backend
      Cluster:
        Fn::ImportValue: !Sub careconnect-${Environment}-EcsClusterArn
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      # Spring Boot startup takes a while; don't let NLB health checks kill new tasks.
      HealthCheckGracePeriodSeconds: 240
      LoadBalancers:
        - ContainerName: cc-backend
          ContainerPort: !Ref InternalWebSocketPort
          TargetGroupArn: !Ref WsTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - Fn::ImportValue: !Sub careconnect-${Environment}-EcsTaskSecurityGroupId
          Subnets:
            - Fn::ImportValue: !Sub careconnect-${Environment}-PublicSubnetAId
            - Fn::ImportValue: !Sub careconnect-${Environment}-PublicSubnetBId
      ServiceRegistries:
        - RegistryArn: !GetAtt CloudMapService.Arn
          Port: !Ref ContainerPort

  # ---------------------------------------------------------------------------
  # EventBridge → API Gateway webhook for KVS attendee→stream discovery.
  # Chime pushes chime:MediaPipelineKinesisVideoStreamStart; app registers mappings.
  # ---------------------------------------------------------------------------

  ChimeKvsStreamDiscoveryConnection:
    Type: AWS::Events::Connection
    Properties:
      Name: !Sub careconnect-${Environment}-chime-kvs-discovery
      AuthorizationType: API_KEY
      AuthParameters:
        ApiKeyAuthParameters:
          ApiKeyName: X-EventBridge-Connection
          ApiKeyValue: !Sub 'careconnect-${Environment}-kvs-discovery'

  ChimeKvsStreamDiscoveryApiDestination:
    Type: AWS::Events::ApiDestination
    Properties:
      Name: !Sub careconnect-${Environment}-chime-kvs-discovery
      ConnectionArn: !GetAtt ChimeKvsStreamDiscoveryConnection.Arn
      InvocationEndpoint: !If
        - HasCustomDomain
        - !Sub 'https://${DomainName}/api/internal/chime/media-stream-events'
        - !Sub
          - '${ApiBase}/api/internal/chime/media-stream-events'
          - ApiBase: !GetAtt HttpApi.ApiEndpoint
      HttpMethod: POST
      InvocationRateLimitPerSecond: 10

  ChimeKvsStreamDiscoveryInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeChimeKvsApiDestination
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:InvokeApiDestination
                Resource: !GetAtt ChimeKvsStreamDiscoveryApiDestination.Arn

  ChimeKvsStreamStartRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub careconnect-${Environment}-chime-kvs-stream-start
      Description: Forward Chime per-attendee KVS stream starts to backend webhook
      EventPattern:
        source:
          - aws.chime
        detail-type:
          - Chime Media Pipeline State Change
        detail:
          eventType:
            - chime:MediaPipelineKinesisVideoStreamStart
      State: ENABLED
      Targets:
        - Id: ChimeKvsStreamDiscoveryWebhook
          Arn: !GetAtt ChimeKvsStreamDiscoveryApiDestination.Arn
          RoleArn: !GetAtt ChimeKvsStreamDiscoveryInvokeRole.Arn

Outputs:
  # API Gateway invoke URL (always available).
  ApiEndpoint:
    Description: API Gateway HTTP API default endpoint
    Value: !GetAtt HttpApi.ApiEndpoint
    Export:
      Name: !Sub careconnect-${Environment}-ApiEndpoint

  # Custom domain URL (only when custom domain is configured).
  CustomDomainUrl:
    Condition: HasCustomDomain
    Description: Custom domain HTTPS URL
    Value: !Sub https://${DomainName}
    Export:
      Name: !Sub careconnect-${Environment}-CustomDomainUrl

  # Service name for CI/CD to force new deployments.
  ServiceName:
    Value: !Ref EcsService
    Export:
      Name: !Sub careconnect-${Environment}-ServiceName

  # VPC Link ID for reference by other stacks.
  VpcLinkId:
    Value: !Ref VpcLink
    Export:
      Name: !Sub careconnect-${Environment}-VpcLinkId

  # API ID for reference.
  HttpApiId:
    Value: !Ref HttpApi
    Export:
      Name: !Sub careconnect-${Environment}-HttpApiId

  # Base URL for the Flutter build (--dart-define=WEBSOCKET_GATEWAY_URL=...).
  # Clients append ?channel=calls|careconnect|notifications|chat.
  WebSocketUrl:
    Description: API Gateway WebSocket API URL (frontend WEBSOCKET_GATEWAY_URL)
    Value: !Sub wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub careconnect-${Environment}-WebSocketUrl
