# Team B — Feature Development Build Pipeline
#
# Runs once on every PR targeting team-b-develop.
# A failing test blocks the merge — no duplicate runs on push.
#
# Triggers:
#   PR → team-b-develop

name: Team B Develop Branch CI

on:
  pull_request:
    branches:
      - team-b-develop

env:
  FLUTTER_VERSION: '3.x'
  JAVA_VERSION: '17'
  # Parallel Flutter test runners — matches local full-suite verification.
  FLUTTER_TEST_CONCURRENCY: '4'

# Cancel superseded runs on the same PR so CI does not pile up.
concurrency:
  group: team-b-ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  team-b-pipeline:
    name: Team B — Build & Test
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------------
      # Stage 1: Checkout + branch info + JAVA_HOME
      # ----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log branch info
        run: |
          echo "Branch: ${{ github.head_ref }}"
          echo "Event: ${{ github.event_name }}"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Confirm JAVA_HOME
        run: |
          echo "JAVA_HOME=${JAVA_HOME}"
          java -version

      # ----------------------------------------------------------------
      # Stage 2: Build — Flutter + Maven
      # ----------------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: frontend
        run: |
          cp .env.example .env 2>/dev/null || touch .env
          flutter pub get

      - name: Flutter analyze (fast static check)
        working-directory: frontend
        continue-on-error: true
        run: |
          flutter analyze --no-pub 2>&1 | tail -5
          echo "Note: analyze is informational — Team D's SAST pipeline enforces analysis."

      - name: Maven compile (skip tests)
        working-directory: backend/core
        run: mvn -B clean compile -DskipTests

      # Web uses different conditional imports (dart.library.js_interop)
      # than the native path, so web-only breakage is invisible to the
      # other build/test steps. Compile check only — no artifacts kept.
      - name: Flutter build web (compile check)
        working-directory: frontend
        run: flutter build web --release

      # ----------------------------------------------------------------
      # Stage 3: Unit tests (BLOCKING — no continue-on-error)
      # ----------------------------------------------------------------
      - name: Flutter unit tests
        working-directory: frontend
        run: |
          flutter test \
            --concurrency="${FLUTTER_TEST_CONCURRENCY}" \
            --exclude-tags integration \
            --reporter expanded

      - name: Maven unit tests
        working-directory: backend/core
        run: mvn -B test

      # ----------------------------------------------------------------
      # Stage 4: Test result artifact upload
      # ----------------------------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            backend/core/target/surefire-reports/
            frontend/test-results/
          retention-days: 14
