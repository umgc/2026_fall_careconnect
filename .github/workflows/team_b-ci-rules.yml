# Team B — Feature Development Build Pipeline
#
# Runs once on every PR targeting team-b-develop.
# A failing test blocks the merge — no duplicate runs on push.
#
# Triggers:
#   PR → team-b-develop

name: Team B Develop Branch CI

on:
  pull_request:
    branches:
      - team-b-develop

env:
  FLUTTER_VERSION: '3.x'
  JAVA_VERSION: '17'
  # Parallel Flutter test runners — matches local full-suite verification.
  FLUTTER_TEST_CONCURRENCY: '4'

# Cancel superseded runs on the same PR so CI does not pile up.
concurrency:
  group: team-b-ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  team-b-pipeline:
    name: Team B — Build & Test
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------------
      # Stage 1: Checkout + branch info + JAVA_HOME
      # ----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log branch info
        run: |
          echo "Branch: ${{ github.head_ref }}"
          echo "Event: ${{ github.event_name }}"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Confirm JAVA_HOME
        run: |
          echo "JAVA_HOME=${JAVA_HOME}"
          java -version

      # ----------------------------------------------------------------
      # Stage 2: Build — Flutter + Maven
      # ----------------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: frontend
        run: |
          cp .env.example .env 2>/dev/null || touch .env
          flutter pub get

      - name: Flutter analyze (fast static check)
        working-directory: frontend
        continue-on-error: true
        run: |
          flutter analyze --no-pub 2>&1 | tail -5
          echo "Note: analyze is informational — Team D's SAST pipeline enforces analysis."

      - name: Maven compile (skip tests)
        working-directory: backend/core
        run: mvn -B clean compile -DskipTests

      # Web uses different conditional imports (dart.library.js_interop)
      # than the native path, so web-only breakage is invisible to the
      # other build/test steps. Compile check only — no artifacts kept.
      - name: Flutter build web (compile check)
        working-directory: frontend
        run: flutter build web --release

      # ----------------------------------------------------------------
      # Stage 3: Unit tests (BLOCKING — no continue-on-error)
      # ----------------------------------------------------------------

      # Determine the diff base (PR merge base) and whether a full
      # test run is required.  A full run is triggered when project-wide
      # files change (pubspec, pom.xml, analysis_options) because those
      # affect every file in the project.
      - name: Determine changed test diff base
        run: |
          BASE=$(git merge-base HEAD origin/${{ github.base_ref }})
          echo "DIFF_BASE=${BASE}" >> "$GITHUB_ENV"

          # Flutter infra files
          FLUTTER_INFRA=$(git diff --name-only "${BASE}" -- \
                   frontend/pubspec.yaml \
                   frontend/pubspec.lock \
                   frontend/analysis_options.yaml | wc -l)

          # Maven infra files
          MAVEN_INFRA=$(git diff --name-only "${BASE}" -- \
                   backend/core/pom.xml | wc -l)

          if [ "$FLUTTER_INFRA" -gt 0 ] || [ "$MAVEN_INFRA" -gt 0 ]; then
            echo "RUN_FULL_TESTS=true" >> "$GITHUB_ENV"
            echo "Infrastructure file changed — full test suite will run."
          else
            echo "RUN_FULL_TESTS=false" >> "$GITHUB_ENV"
          fi

      - name: Flutter unit tests (full suite)
        if: env.RUN_FULL_TESTS == 'true'
        working-directory: frontend
        run: |
          flutter test \
            --concurrency="${FLUTTER_TEST_CONCURRENCY}" \
            --exclude-tags integration \
            --reporter expanded

      - name: Flutter unit tests (changed files only)
        if: env.RUN_FULL_TESTS != 'true'
        working-directory: frontend
        run: |
          CHANGED="$(git diff --name-only "${DIFF_BASE}" -- .)"

          TEST_FILES=()

          while IFS= read -r f; do
            [ -z "$f" ] && continue

            case "$f" in
              test/*_test.dart)
                TEST_FILES+=("$f")
                ;;
              lib/*.dart)
                candidate="test/${f#lib/}"
                candidate="${candidate%.dart}_test.dart"
                [ -f "$candidate" ] && TEST_FILES+=("$candidate")
                ;;
            esac
          done <<< "$CHANGED"

          if [ ${#TEST_FILES[@]} -eq 0 ]; then
            echo "No frontend test files map to changed code in this push; skipping."
            exit 0
          fi

          mapfile -t UNIQUE < <(printf '%s\n' "${TEST_FILES[@]}" | sort -u)
          echo "Running: ${UNIQUE[*]}"

          flutter test \
            --concurrency="${FLUTTER_TEST_CONCURRENCY}" \
            --exclude-tags integration \
            --reporter expanded \
            "${UNIQUE[@]}"

      - name: Maven unit tests (full suite)
        if: env.RUN_FULL_TESTS == 'true'
        working-directory: backend/core
        run: mvn -B test

      - name: Maven unit tests (changed files only)
        if: env.RUN_FULL_TESTS != 'true'
        working-directory: backend/core
        run: |
          CHANGED="$(git diff --name-only "${DIFF_BASE}" -- src/)"

          TEST_CLASSES=()

          while IFS= read -r f; do
            [ -z "$f" ] && continue

            case "$f" in
              src/test/java/*)
                # Direct change to a test file — extract class name
                cls=$(basename "$f" .java)
                TEST_CLASSES+=("$cls")
                ;;
              src/main/java/*)
                # Changed source file — look for matching test class
                cls=$(basename "$f" .java)
                candidate_test="${cls}Test"
                TEST_CLASSES+=("$candidate_test")
                ;;
            esac
          done <<< "$CHANGED"

          if [ ${#TEST_CLASSES[@]} -eq 0 ]; then
            echo "No backend test classes map to changed code in this push; skipping."
            exit 0
          fi

          mapfile -t UNIQUE < <(printf '%s\n' "${TEST_CLASSES[@]}" | sort -u)
          TEST_PATTERN=$(IFS=","; echo "${UNIQUE[*]}")
          echo "Running test classes: ${TEST_PATTERN}"

          mvn -B test -Dtest="${TEST_PATTERN}" -DfailIfNoTests=false

      # ----------------------------------------------------------------
      # Stage 4: Test result artifact upload
      # ----------------------------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            backend/core/target/surefire-reports/
            frontend/test-results/
          retention-days: 14
