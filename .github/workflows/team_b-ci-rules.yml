# team-b-ci.yml
# Team B — Feature Development Build & Test Pipeline
#
# Team B's charter shifted from owning testing/quality/security to
# feature development. Security/SAST/SCA/secrets scanning is already
# enforced repo-wide by Team D's build-and-analyze.yml (it runs on
# every PR regardless of target branch), so this pipeline no longer
# duplicates that. Its only job now is to keep team-b-develop
# buildable and give fast, BLOCKING feedback on unit test regressions.
#
# Triggers:
#   push  feature/b-*, fix/b-*, sync/team-b-*, team-b-develop, develop
#   PR    → team-b-develop, develop
#
# Stages (single job, sequential steps):
#   1. Checkout, branch info, JAVA_HOME
#   2. Build  (Flutter + Maven)
#   3. Unit tests (BLOCKING — a failing test fails the PR)
#        - PR, and direct push to develop/team-b-develop: full suite
#        - push to feature/b-*, fix/b-*, sync/team-b-*: only tests
#          that map to files changed since branching off team-b-develop
#   4. Test result artifact upload

name: Team B CI

on:
  push:
    branches:
      - develop
      - team-b-develop
      - 'feature/b-*'
      - 'fix/b-*'
      - 'sync/team-b-*'
  pull_request:
    branches:
      - develop
      - team-b-develop

env:
  FLUTTER_VERSION: '3.x'
  JAVA_VERSION: '17'
  # Parallel Flutter test runners — matches local full-suite verification.
  FLUTTER_TEST_CONCURRENCY: '4'
  # A push to feature/b-*, fix/b-*, or sync/team-b-* only runs tests
  # affected by that branch's changes (fast, pre-PR sanity check) —
  # otherwise the same full suite runs twice (once on push, once on
  # the PR) for no added signal. PRs and direct pushes to
  # develop/team-b-develop always run the full suite as the real gate.
  RUN_FULL_TESTS: >-
    ${{ github.event_name == 'pull_request' ||
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/team-b-develop' }}

# Cancel superseded runs on the same branch/PR so CI does not pile up.
concurrency:
  group: team-b-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  team-b-pipeline:
    name: Team B — Build & Test
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------------
      # Stage 1: Checkout + branch info + JAVA_HOME
      # ----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log branch info
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "Branch: ${BRANCH}"
          echo "Event: ${{ github.event_name }}"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Confirm JAVA_HOME
        run: |
          echo "JAVA_HOME=${JAVA_HOME}"
          java -version

      # ----------------------------------------------------------------
      # Stage 2: Build — Flutter + Maven
      # ----------------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: frontend
        run: |
          cp .env.example .env 2>/dev/null || touch .env
          flutter pub get

      - name: Flutter analyze (fast static check)
        working-directory: frontend
        continue-on-error: true
        run: |
          flutter analyze --no-pub 2>&1 | tail -5
          echo "Note: analyze is informational — Team D's SAST pipeline enforces analysis."

      - name: Maven compile (skip tests)
        working-directory: backend/core
        run: mvn -B clean compile -DskipTests

      # Web uses different conditional imports (dart.library.js_interop)
      # than the native path, so web-only breakage is invisible to the
      # other build/test steps. Compile check only — no artifacts kept.
      - name: Flutter build web (compile check)
        working-directory: frontend
        run: flutter build web --release

      # ----------------------------------------------------------------
      # Stage 3: Unit tests (BLOCKING — no continue-on-error)
      # ----------------------------------------------------------------
      - name: Determine changed-test diff base
        if: env.RUN_FULL_TESTS != 'true'
        run: |
          git fetch origin +team-b-develop:refs/remotes/origin/team-b-develop
          echo "DIFF_BASE=$(git merge-base HEAD origin/team-b-develop)" >> "$GITHUB_ENV"

      - name: Flutter unit tests (full suite)
        if: env.RUN_FULL_TESTS == 'true'
        working-directory: frontend
        run: |
          flutter test \
            --concurrency="${FLUTTER_TEST_CONCURRENCY}" \
            --exclude-tags integration \
            --reporter expanded

      # Maps changed lib/**.dart files to their test/**_test.dart
      # counterpart by naming convention, plus any test files changed
      # directly. Doesn't catch tests that indirectly depend on a
      # changed file without a 1:1 named test — the PR's full suite
      # is the real safety net for that.
      - name: Flutter unit tests (changed files only)
        if: env.RUN_FULL_TESTS != 'true'
        working-directory: frontend
        run: |
          CHANGED="$(git diff --name-only "${DIFF_BASE}" -- .)"
          TEST_FILES=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              test/*_test.dart)
                TEST_FILES+=("$f")
                ;;
              lib/*.dart)
                candidate="test/${f#lib/}"
                candidate="${candidate%.dart}_test.dart"
                [ -f "$candidate" ] && TEST_FILES+=("$candidate")
                ;;
            esac
          done <<< "$CHANGED"

          if [ ${#TEST_FILES[@]} -eq 0 ]; then
            echo "No frontend test files map to changed code in this push; skipping."
            exit 0
          fi
          mapfile -t UNIQUE < <(printf '%s\n' "${TEST_FILES[@]}" | sort -u)
          echo "Running: ${UNIQUE[*]}"
          flutter test \
            --concurrency="${FLUTTER_TEST_CONCURRENCY}" \
            --exclude-tags integration \
            --reporter expanded \
            "${UNIQUE[@]}"

      - name: Maven unit tests (full suite)
        if: env.RUN_FULL_TESTS == 'true'
        working-directory: backend/core
        run: mvn -B test

      # Maps changed src/main/java/**.java files to their
      # src/test/java/**Test.java counterpart by naming convention,
      # plus any test files changed directly. Same caveat as the
      # Flutter step above — the PR's full suite is the real gate.
      - name: Maven unit tests (changed files only)
        if: env.RUN_FULL_TESTS != 'true'
        working-directory: backend/core
        run: |
          CHANGED="$(git diff --name-only "${DIFF_BASE}" -- .)"
          TEST_CLASSES=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              src/test/java/*Test.java)
                rel="${f#src/test/java/}"
                TEST_CLASSES+=("${rel%.java}")
                ;;
              src/main/java/*.java)
                rel="${f#src/main/java/}"
                base="${rel%.java}"
                candidate="src/test/java/${base}Test.java"
                [ -f "$candidate" ] && TEST_CLASSES+=("${base}Test")
                ;;
            esac
          done <<< "$CHANGED"

          if [ ${#TEST_CLASSES[@]} -eq 0 ]; then
            echo "No backend test classes map to changed code in this push; skipping."
            exit 0
          fi
          mapfile -t UNIQUE < <(printf '%s\n' "${TEST_CLASSES[@]}" | sort -u | tr '/' '.')
          TEST_ARG="$(IFS=,; echo "${UNIQUE[*]}")"
          echo "Running: ${TEST_ARG}"
          mvn -B test -Dtest="${TEST_ARG}"

      # ----------------------------------------------------------------
      # Stage 4: Test result artifact upload
      # ----------------------------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            backend/core/target/surefire-reports/
            frontend/test-results/
          retention-days: 14
