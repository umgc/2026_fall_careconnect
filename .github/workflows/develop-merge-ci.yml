# develop-merge-ci.yml
# CareConnect — Team Develop -> Develop Merge CI Pipeline
#
# Runs on every PR from a team-*-develop branch into `develop`. This is
# the stage right after several feature/* branches have already been
# merged together at the team level (feature/* -> team-*-develop is
# covered by team-merge-ci.yml, which only tests files changed in that PR).
# This workflow validates that combined, team-level state.
#
# Scope on purpose:
#   - Runs the FULL unit/widget suite (not diff-scoped) as a cheap
#     regression safety net for the merge of multiple features.
#   - Does NOT run E2E or integration tests -- those run one stage later,
#     on develop -> staging.
#   - Does NOT run SAST/SCA/secrets scanning, including `flutter analyze`
#     -- Team D's build-and-analyze.yml already runs on every PR
#     regardless of target branch (team-merge-ci.yml also already ran it
#     for each individual feature); not duplicated here.
#   - Source-branch legitimacy (PRs to develop must come from a
#     team-*-develop branch) is enforced by branch-source-gate.yml, not
#     re-implemented here.
#   - team-a-develop (testing team) never changes other teams' source or
#     unit tests -- it only adds E2E tests, which run one stage later on
#     develop -> staging, and each team already runs its own full unit
#     suite worth of diff coverage when it merges into team-a-develop's
#     peers via team-merge-ci.yml. So the full-suite steps below are skipped
#     for PRs sourced from team-a-develop. Each job stays unconditional
#     (steps are skipped, not the job) so it still reports a status
#     instead of leaving a required check stuck at "Expected -- waiting
#     for status to be reported."
#
# Stages (parallel jobs):
#   backend:         mvn -B clean verify (BLOCKING: compile + full test
#                    suite + package + jacoco report, in one invocation)
#                    + coverage regression gate
#   frontend-test:   flutter test full suite (BLOCKING), sharded across
#                    FLUTTER_TEST_SHARDS matrix runners -- the suite is
#                    large enough (~11k tests) that a single runner made
#                    this the slowest job in the pipeline
#   frontend-build:  flutter build web (BLOCKING), independent of the
#                    sharded tests
#   frontend-coverage: merges each shard's lcov.info with `lcov`, then
#                    runs the same coverage regression gate as backend
#
# Triggers:
#   PR -> develop (in practice, only from team-*-develop branches; see
#   branch-source-gate.yml)

name: Develop Merge CI

on:
  pull_request:
    branches:
      - develop

env:
  FLUTTER_VERSION: '3.x'
  JAVA_VERSION: '17'
  FLUTTER_TEST_CONCURRENCY: '4'
  # Number of parallel matrix runners the frontend test suite is split
  # across (see frontend-test below). Orthogonal to FLUTTER_TEST_CONCURRENCY
  # above, which controls worker processes *within* each shard's runner.
  # Tried 8 (up from 4) after a real CI run measured the unsharded job at
  # 19 minutes, but 4 -> 8 only saved ~1 minute in practice: the real
  # bottleneck was a hanging test (now quarantined below), not shard
  # count, and more shards just means more runners paying the same fixed
  # checkout/setup/compile overhead. Back to 4.
  FLUTTER_TEST_SHARDS: '4'
  # Whole-repo coverage regression baseline, agreed 2026-09-15.
  # Backend measured ~82.8% locally at the time this was set, so 0.80
  # leaves headroom; frontend's actual current % was not verified before
  # picking this number, so watch the first few runs of this gate.
  BACKEND_COVERAGE_BASELINE: '0.80'
  FRONTEND_COVERAGE_BASELINE: '0.80'

concurrency:
  group: develop-merge-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------
  # Backend — full compile + test + package + coverage
  # --------------------------------------------------------------------
  backend:
    name: Backend — Full Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # team-a-develop only adds E2E tests and never touches other
      # teams' source or unit tests, so there is nothing new here for
      # this job to catch. Every later step checks this output instead
      # of the job being conditionally skipped, so the job still reports
      # a status for branch-protection purposes.
      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.head_ref }}" = "team-a-develop" ]; then
            echo "run_suite=false" >> "$GITHUB_OUTPUT"
            echo "Source branch is team-a-develop (E2E-only team) -- skipping full backend suite."
          else
            echo "run_suite=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.mode.outputs.run_suite == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup backend toolchain
        if: steps.mode.outputs.run_suite == 'true'
        uses: ./.github/actions/setup-backend
        with:
          java-version: ${{ env.JAVA_VERSION }}

      # Single command: compile + full unit test suite + package +
      # jacoco report (bound to the `test` phase) + jacoco-check (bound
      # to `verify`, enforces the existing per-package thresholds
      # already defined in pom.xml). No separate `mvn test` call.
      - name: Maven full verify (compile + test + package + jacoco)
        if: steps.mode.outputs.run_suite == 'true'
        working-directory: backend/core
        run: mvn -B clean verify

      - name: Set up Python (coverage regression gate)
        if: steps.mode.outputs.run_suite == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Backend coverage regression gate
        if: steps.mode.outputs.run_suite == 'true'
        run: |
          python scripts/coverage_baseline_gate.py \
            --jacoco-xml backend/core/target/site/jacoco/jacoco.xml \
            --threshold "${BACKEND_COVERAGE_BASELINE}"

      - name: Upload backend test results
        if: always() && steps.mode.outputs.run_suite == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: develop-merge-backend-results
          path: |
            backend/core/target/surefire-reports/
            backend/core/target/site/jacoco/
          retention-days: 14

  # --------------------------------------------------------------------
  # Frontend — full test suite, sharded across matrix runners
  # --------------------------------------------------------------------
  frontend-test:
    name: Frontend Test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.head_ref }}" = "team-a-develop" ]; then
            echo "run_suite=false" >> "$GITHUB_OUTPUT"
            echo "Source branch is team-a-develop (E2E-only team) -- skipping full frontend suite."
          else
            echo "run_suite=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.mode.outputs.run_suite == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup frontend toolchain
        if: steps.mode.outputs.run_suite == 'true'
        uses: ./.github/actions/setup-frontend
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # --total-shards/--shard-index split the suite across matrix
      # runners; --concurrency is still the worker count *within* this
      # one shard's runner. Each shard writes its own coverage/lcov.info,
      # merged back into one report by frontend-coverage below.
      #
      # QUARANTINE: test/features/usps/usps_test_screen_test.dart hangs
      # on a leaked async callback in its "Clear Cache with null user"
      # case and eats the full 10-minute default test timeout --
      # `--timeout=60s` does NOT help here, since testWidgets() passes
      # its own Timeout through TestWidgetsFlutterBinding, which takes
      # priority over package:test's CLI default. Whichever shard draws
      # this file is stuck for 10 minutes regardless of shard count, so
      # the file is excluded from this run entirely (not fixed here --
      # tracked with the rest of the known frontend failures). Remove
      # this exclusion once that hang is fixed.
      - name: Flutter test (shard ${{ matrix.shard }}/${{ env.FLUTTER_TEST_SHARDS }})
        if: steps.mode.outputs.run_suite == 'true'
        working-directory: frontend
        run: |
          mapfile -t TEST_FILES < <(
            find test -name '*_test.dart' \
              ! -path 'test/features/usps/usps_test_screen_test.dart' \
            | sort
          )
          flutter test "${TEST_FILES[@]}" \
            --concurrency="${FLUTTER_TEST_CONCURRENCY}" \
            --coverage \
            --total-shards="${FLUTTER_TEST_SHARDS}" \
            --shard-index="${{ matrix.shard }}" \
            --timeout=30s \
            --reporter expanded

      - name: Upload shard coverage
        if: steps.mode.outputs.run_suite == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-shard-${{ matrix.shard }}
          path: frontend/coverage/lcov.info
          retention-days: 3
          if-no-files-found: error

  # --------------------------------------------------------------------
  # Frontend — web build (independent of the sharded tests above)
  # --------------------------------------------------------------------
  frontend-build:
    name: Frontend — Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.head_ref }}" = "team-a-develop" ]; then
            echo "run_suite=false" >> "$GITHUB_OUTPUT"
            echo "Source branch is team-a-develop (E2E-only team) -- skipping web build."
          else
            echo "run_suite=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.mode.outputs.run_suite == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup frontend toolchain
        if: steps.mode.outputs.run_suite == 'true'
        uses: ./.github/actions/setup-frontend
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Web uses different conditional imports (dart.library.js_interop)
      # than the native path, so web-only breakage is invisible to the
      # unit/widget test shards above. Separate compile check, not a
      # duplicate of `flutter test` — no artifacts kept.
      - name: Flutter build web (compile check)
        if: steps.mode.outputs.run_suite == 'true'
        working-directory: frontend
        run: flutter build web --release

  # --------------------------------------------------------------------
  # Frontend — merge shard coverage + regression gate
  # --------------------------------------------------------------------
  frontend-coverage:
    name: Frontend Coverage Regression Gate
    needs: frontend-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.head_ref }}" = "team-a-develop" ]; then
            echo "run_suite=false" >> "$GITHUB_OUTPUT"
            echo "Source branch is team-a-develop (E2E-only team) -- skipping coverage merge."
          else
            echo "run_suite=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.mode.outputs.run_suite == 'true'
        uses: actions/checkout@v4

      - name: Download shard coverage
        if: steps.mode.outputs.run_suite == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: frontend-coverage-shard-*
          path: shard-coverage

      # `lcov -a` unions per-file hit/line data correctly; naively
      # concatenating the raw lcov.info files would double-count shared
      # source files that more than one shard touched.
      - name: Merge shard coverage with lcov
        if: steps.mode.outputs.run_suite == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lcov
          ARGS=()
          for f in shard-coverage/*/lcov.info; do
            ARGS+=(-a "$f")
          done
          lcov "${ARGS[@]}" -o merged-lcov.info

      - name: Set up Python (coverage regression gate)
        if: steps.mode.outputs.run_suite == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Frontend coverage regression gate
        if: steps.mode.outputs.run_suite == 'true'
        run: |
          python scripts/coverage_baseline_gate.py \
            --lcov-info merged-lcov.info \
            --threshold "${FRONTEND_COVERAGE_BASELINE}"

      - name: Upload merged coverage
        if: always() && steps.mode.outputs.run_suite == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: develop-merge-frontend-coverage
          path: merged-lcov.info
          retention-days: 14
