name: Team A Flutter Testing

on:
  push:
    branches: [careconnect_test, team-a-develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/careconnect_automate_testing.yml'
  pull_request:
    branches: [careconnect_test, team-a-develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/careconnect_automate_testing.yml'
  workflow_dispatch:
    inputs:
      create_pr:
        description: 'After successful tests, create a PR from team-a-develop to develop (run from team-a-develop)'
        type: boolean
        default: false
      run_e2e:
        description: 'Run Windows desktop integration/E2E tests'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: flutter-testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend
    shell: bash

env:
  FLUTTER_VERSION: '3.47.8'
  COVERAGE_MIN: '80'
  ACCESSIBILITY_TEST_DIR: 'test/team_alpha_accessibility'

jobs:
  unit-and-coverage:
    name: Flutter unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit/widget tests and coverage
        run: flutter test test/ --coverage --reporter expanded
      - name: Check coverage threshold
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('coverage/lcov.info')
          if not p.exists():
              raise SystemExit('Coverage report missing')
          lines = p.read_text().splitlines()
          found = sum(int(x[3:]) for x in lines if x.startswith('LF:'))
          hit = sum(int(x[3:]) for x in lines if x.startswith('LH:'))
          if found == 0:
              raise SystemExit('No instrumented lines found')
          percentage = hit * 100 / found
          minimum = float(os.environ['COVERAGE_MIN'])
          print(f'Line coverage: {percentage:.2f}% (minimum {minimum:.0f}%)')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'### Flutter coverage: {percentage:.2f}% (minimum {minimum:.0f}%)\n')
          if percentage < minimum:
              raise SystemExit('Coverage threshold not met')
          PY
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-a-flutter-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: warn

  accessibility:
    name: Flutter accessibility checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify accessibility test suite exists
        run: |
          if [ ! -d "$ACCESSIBILITY_TEST_DIR" ] || ! find "$ACCESSIBILITY_TEST_DIR" -name '*_test.dart' -print -quit | grep -q .; then
            echo "::error::Add Flutter accessibility widget tests under frontend/$ACCESSIBILITY_TEST_DIR/."
            echo 'Use tester.ensureSemantics(), meetsGuideline(androidTapTargetGuideline),'
            echo 'meetsGuideline(iOSTapTargetGuideline), meetsGuideline(labeledTapTargetGuideline),'
            echo 'and meetsGuideline(textContrastGuideline) on actual app screens.'
            exit 1
          fi
      - name: Run accessibility widget tests
        run: flutter test "$ACCESSIBILITY_TEST_DIR/" --reporter expanded

  integration-e2e:
    name: Integration and E2E tests (Windows desktop)
    runs-on: windows-latest
    timeout-minutes: 45
    if: github.event_name != 'workflow_dispatch' || inputs.run_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Verify Windows platform and integration tests exist
        run: |
          if [ ! -d windows ]; then
            echo '::error::frontend/windows/ is missing. Run "flutter create --platforms=windows ." in frontend/ and commit it.'
            exit 1
          fi
          if ! compgen -G 'integration_test/*_test.dart' > /dev/null; then
            echo '::error::Add integration/E2E tests under frontend/integration_test/ (files ending in _test.dart).'
            exit 1
          fi
      - name: Flutter devices
        run: flutter devices
      # Run each file in its own `flutter test` process. Running the whole
      # directory in one invocation launches the desktop app once per file, and
      # every launch after the first fails with "Error waiting for a debug
      # connection: The log reader stopped unexpectedly" (Flutter desktop limitation).
      - name: Run integration and E2E tests on Windows desktop
        run: |
          failed=()
          for test_file in integration_test/*_test.dart; do
            echo "::group::$test_file"
            if ! flutter test "$test_file" -d windows --reporter expanded; then
              failed+=("$test_file")
            fi
            # Make sure the previous app instance is gone before the next launch.
            taskkill //F //IM care_connect_app.exe > /dev/null 2>&1 || true
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -ne 0 ]; then
            printf '::error::Integration test failed: %s\n' "${failed[@]}"
            exit 1
          fi

  create-pull-request:
    name: Open PR to develop (manual opt-in)
    needs: [unit-and-coverage, accessibility, integration-e2e]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.create_pr == true &&
      github.ref_name == 'team-a-develop' &&
      needs.unit-and-coverage.result == 'success' &&
      needs.accessibility.result == 'success' &&
      needs.integration-e2e.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create PR from team-a-develop to develop
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh pr list --base develop --head team-a-develop --state open --json number --jq 'length' | grep -qx '0'; then
            gh pr create --base develop --head team-a-develop \
              --title 'Merge Team A Flutter changes into develop' \
              --body 'Automated PR created after successful Flutter analysis, unit tests, coverage gate, accessibility checks, and Windows desktop integration/E2E tests.'
          else
            echo 'An open Team A -> develop PR already exists.'
          fi